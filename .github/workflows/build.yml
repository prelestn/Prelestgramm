name: Сборка APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Собрать debug и release APK
    runs-on: ubuntu-latest

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Выдать права на gradlew
        run: chmod +x ./gradlew

      - name: Кэшировать Gradle-зависимости
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Собрать Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Собрать Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          # При наличии подписи задать в секретах репозитория:
          # KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
          PRELESTGRAM_RELEASE_STORE_FILE: ${{ secrets.KEYSTORE_PATH || '' }}
          PRELESTGRAM_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || '' }}
          PRELESTGRAM_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '' }}
          PRELESTGRAM_RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || '' }}

      - name: Загрузить Debug APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: prelestgram-debug-${{ github.run_number }}
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Загрузить Release APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: prelestgram-release-${{ github.run_number }}
          path: |
            **/build/outputs/apk/release/*.apk
          retention-days: 30
