name: Build Prelestgram APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репо
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Сборка debug APK
        run: ./gradlew :TMessagesProj_App:assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Сборка release APK
        run: ./gradlew :TMessagesProj_App:assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Загрузить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prelestgram-debug
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Загрузить release APK
        uses: actions/upload-artifact@v4
        with:
          name: prelestgram-release
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          retention-days: 7
